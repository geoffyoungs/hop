version: 2

project_name: hop

git:
  ignore_tags:
    - nightly

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - go run ./cmd/gendocs
    - ./scripts/completions.sh

builds:
  - main: ./cmd/hop
    binary: hop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md
      - docs/man/*
      - completions/*

brews:
  - name: hop
    repository:
      owner: geoffyoungs
      name: homebrew-tap
    homepage: https://github.com/geoffyoungs/hop
    description: "CLI tool for connecting to named hosts via SSH, Docker, or Kubernetes"
    license: "MIT"
    skip_upload: auto
    install: |
      bin.install "hop"
      man1.install Dir["docs/man/*.1"]
      bash_completion.install "completions/hop.bash" => "hop"
      zsh_completion.install "completions/hop.zsh" => "_hop"
      fish_completion.install "completions/hop.fish"

nfpms:
  - package_name: hop
    homepage: https://github.com/geoffyoungs/hop
    maintainer: Geoff Youngs <git@intersect-uk.co.uk>
    description: "CLI tool for connecting to named hosts via SSH, Docker, or Kubernetes"
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: docs/man/hop.1
        dst: /usr/share/man/man1/hop.1
      - src: docs/man/hop-completion.1
        dst: /usr/share/man/man1/hop-completion.1
      - src: completions/hop.bash
        dst: /usr/share/bash-completion/completions/hop
      - src: completions/hop.zsh
        dst: /usr/share/zsh/vendor-completions/_hop
      - src: completions/hop.fish
        dst: /usr/share/fish/vendor_completions.d/hop.fish

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  # Set to auto to skip during local builds
  skip_upload: auto
